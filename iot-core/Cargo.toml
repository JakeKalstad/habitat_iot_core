[package]
name = "iot-core"
version = "0.1.0"
authors = ["jake kalstad <jakekalstad@gmail.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "iot-core"
harness = false


[profile.release]
opt-level = "s"
strip = true

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
# Bare device with no sensors
bare = ["std", "embassy", "esp-idf-svc/native"]
motion_sensor = ["std", "embassy", "esp-idf-svc/native"]
temp_humidity = ["std", "embassy", "esp-idf-svc/native", "dep:dht-sensor"]
temp_pressure = ["std", "embassy", "esp-idf-svc/native", "dep:bmp280-driver"]
water_sensor = ["std", "embassy", "esp-idf-svc/native"]
reed_switch = ["std", "embassy", "esp-idf-svc/native"]
air_quality = ["std", "embassy", "esp-idf-svc/native", "dep:sgp30"]
display= ["std", "embassy", "esp-idf-svc/native", "dep:pcd8544"]
servo = ["std", "embassy", "esp-idf-svc/native"]
motor = ["std", "embassy", "esp-idf-svc/native", "dep:l298n"]
reset_volatile = []
host=[]

default = ["std",  "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver"]

[dependencies]
log = { version = "0.4.29", default-features = false }
esp-idf-svc = { version = "0.51.0", default-features = true, optional=true }
esp-idf-hal = { version = "0.45.2", features = [] }
embedded-svc="0.28.1"
heapless = "0.9.2"
anyhow="1.0.100"
build-time = "0.1.3"
serde_json = "1.0.145"
serde = {version= "1.0.228"}
serde_derive = "1.0.228"
dht-sensor = {version="*", optional=true}
sgp30={version="*", optional=true}
iot-common={path="../iot-common"}
urlencoding="*"
esp-idf-sys="*"
pcd8544={optional=true,path="../pcd8544"}
bmp280-driver = {optional=true, version="*"}
l298n = {optional=true, version="*"}

[dependencies.uuid]
version = "1.19.0"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[build-dependencies]
embuild = {version="0.33.1", features=["espidf"]}

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2.5" }
extra_components_generate_bindings = true