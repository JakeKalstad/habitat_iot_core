<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Initialize Your Smart Device</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            color: #333;
            margin: 0;
            padding: 2%;
        }

        h1,
        h2,
        h3 {
            font-family: 'Roboto', sans-serif;
            font-size: 3rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            font-size: 2em
        }

        h3 {
            font-size: 1.5em
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        p {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            height: 2px;
            background-color: #007bff;
            margin: 40px 0;
        }

        form {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            display: block;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
            border-radius: 3px;
            margin-right: 10px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        input[type="checkbox"]:checked {
            background-color: #007bff;
            border-color: #007bff;
        }

        input[type="checkbox"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .select-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            cursor: pointer;
            font-size: 16px;
            color: #333;
        }

        .select-wrapper::after {
            content: '\25BC';
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>

<body>
    <div style="text-align:center">
        <div id="logo">
            <h1>🦾</h1>
        </div>
        <h1>Initialize your device by connecting it to your local network</h1>
        <hr />
        <form method="POST" action="/upload">
            <h3>Choose your wifi name and enter the preshared key for your device to join your network.</h3>
            <label for="textbox1">SSID</label><br>
            <div class="select-wrapper">
                {OPTIONS}
            </div>
            <label for="textbox2">Preshared Key</label><br>
            <input type="password" id="password" name="password"><br><br>
            <input type="submit" value="Send Wireless Credentials">
        </form>
    </div>
</body>

</html>
