<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Device Successfully Received your SSID and Key</title>
    <style>
          body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            color: #333;
            margin: 0;
            padding: 2%;
        }

        h1,
        h2,
        h3 {
            font-family: 'Roboto', sans-serif;
            font-size: 3rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            font-size: 2em
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <h1>Device Successfully Received your SSID and Key</h1>
    <h2>You can now reconnect your PC or Smartphone to your home network.</h2>
    <hr />
</body>

</html>
