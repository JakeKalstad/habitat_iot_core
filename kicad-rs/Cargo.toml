[package]
name = "kicad-api-rs"
version = "0.0.1"
edition = "2021"
description = "Rust bindings for the KiCad IPC API"
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://kicad.org"
repository = "https://gitlab.com/kicad/code/kicad-rs"
categories = ["api-bindings", "science"]
keywords = ["kicad"]
include = [
    "kicad/api/proto",
    "**/*.rs",
    "Cargo.toml",
    "LICENSE"
]

[lib]
name = "kicad"

[dependencies]
enum-as-inner = "0.6.0"
nng = "1.0.1"
num-derive = "0.4.1"
num-traits = "0.2.17"
protobuf = "3.3.0"
quick-error = "2.0.1"
rand = "0.8.5"

[build-dependencies]
prettyplease = "0.2.16"
proc-macro2 = "1.0.76"
protobuf-codegen = "3.3.0"
quote = "1.0.35"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
syn = "2.0.48"
walkdir = "2.4.0"

[dev-dependencies]
licensesnip = "1.6.0"
rand = "0.8.5"
