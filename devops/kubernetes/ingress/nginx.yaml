apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: habitat-hub.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: habitat-hub
                port:
                  number: 8084
    - host: habitat-marketing.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: habitat-marketing
                port:
                  number: 8081
    - host: internal-documentation.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: internal-documentation
                port:
                  number: 8082
    - host: test-3000.user-documentation.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-documentation-test
                port:
                  number: 8083