apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-documentation-test
  labels:
    app: user-documentation-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-documentation-test
  template:
    metadata:
      labels:
        app: user-documentation-test
    spec:
      containers:
        - name: user-documentation-test
          image: user-documentation-test:local
          ports:
            - containerPort: 80
      volumes:
        - name: db-storage
          emptyDir: {}