apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-documentation
  labels:
    app: internal-documentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-documentation
  template:
    metadata:
      labels:
        app: internal-documentation
    spec:
      containers:
        - name: internal-documentation
          image: internal-documentation:local
          ports:
            - containerPort: 80
      volumes:
        - name: db-storage
          emptyDir: {}