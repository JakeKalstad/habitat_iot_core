apiVersion: apps/v1
kind: Deployment
metadata:
  name: habitat-marketing
  labels:
    app: habitat-marketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habitat-marketing
  template:
    metadata:
      labels:
        app: habitat-marketing
    spec:
      containers:
        - name: habitat-marketing
          image: habitat-marketing:local
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              value: "sqlite:///usr/local/bin/local_data.db?mode=rwc"
      volumes:
        - name: db-storage
          emptyDir: {}