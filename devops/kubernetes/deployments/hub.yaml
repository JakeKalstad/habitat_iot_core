apiVersion: apps/v1
kind: Deployment
metadata:
  name: habitat-hub
  labels:
    app: habitat-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habitat-hub
  template:
    metadata:
      labels:
        app: habitat-hub
    spec:
      containers:
        - name: habitat-hub
          image: habitat-hub:local
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://root:mypassword@postgres:5432/habitat"
            - name: MOSQUITTO_HOST
              value: "mosquitto-service"
            - name: MOSQUITTO_PORT
              value: "1883"
      volumes:
        - name: db-storage
          emptyDir: {}